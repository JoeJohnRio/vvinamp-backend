schema:
  - graphql/schema/*.graphqls

exec:
  filename: graphql/generated/generated.go
  package: generated

model:
  filename: graphql/model/models.go
  package: model

resolver:
  layout: follow-schema
  dir: graphql/resolvers
  package: resolvers
  filename_template: "{name}.resolvers.go"
  omit_template_comment: false

# Configure which fields need resolvers
models:
  Album:
    model: vvinamp/graphql/model.Album
    fields:
      artist:
        resolver: true
      tracks:
        resolver: true
      
  Artist:
    model: vvinamp/graphql/model.Artist
    fields:
      albums:
        resolver: true
      tracks:
        resolver: true
        
  Genre:
    model: vvinamp/graphql/model.Genre
    fields:
      albums:
        resolver: true
        
  User:
    model: vvinamp/graphql/model.User
    fields:
      playlists:
        resolver: true
      listeningHistory:
        resolver: true
      likedTracks:
        resolver: true
      followedArtists:
        resolver: true
        
  Track:
    fields:
      album:
        resolver: true
      artists:
        resolver: true
        
  Playlist:
    fields:
      creator:
        resolver: true
      tracks:
        resolver: true
  ListeningHistory:
    fields:
      user:
        resolver: true
      content:
        resolver: true
      playedAt:
        resolver: true

  DateTimeISO:
    model: "github.com/99designs/gqlgen/graphql.Time"